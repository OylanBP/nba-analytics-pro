
name: Update NBA standings and rosters

on:
  workflow_dispatch:
  schedule:
    # 台灣時間每天 15:00
    - cron: '0 7 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update standings
        run: python scripts/update_standings.py

      - name: Update rosters
        run: python scripts/update_rosters.py

      - name: Commit updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/standings.json data/rosters.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update NBA standings and rosters'
            git push
          fi
