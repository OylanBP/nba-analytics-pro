
name: Update NBA standings, rosters and player stats

on:
  workflow_dispatch:
  schedule:
    # 台灣時間每天 15:00（UTC 07:00）
    - cron: '0 7 * * *'

concurrency:
  group: nba-injury-ingestion
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update standings
        run: python scripts/update_standings.py

      - name: Update rosters
        run: python scripts/update_rosters.py

      - name: 更新球員背景（失敗時保留已驗證快照）
        continue-on-error: true
        timeout-minutes: 25
        run: python scripts/update_biographies.py

      - name: Update player stats
        run: python scripts/update_player_stats.py

      - name: 更新比賽歷史與驗證分析
        run: |
          node --test tests/*.test.js
          python scripts/update_games.py

      - name: 更新已完賽球員紀錄（來源暫停時沿用上次驗證資料）
        continue-on-error: true
        run: python scripts/player_roles.py

      - name: Bootstrap first verified model when missing
        shell: bash
        run: |
          if ! test -s data/model/champion.json; then
            python scripts/build_model_history.py
            python scripts/model_lifecycle.py --mode train
          fi

      - name: Generate approved model predictions when available
        run: python scripts/predict_games.py

      - name: Commit updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/model/player_box.json.gz data/games.json data/standings.json data/rosters.json data/player_stats.json
          if test -f data/biographies.json; then git add data/biographies.json; fi
          if test -f data/model/predictions.json; then git add data/model/predictions.json; fi
          if test -f data/model/champion.json; then git add data/model/champion.json; fi
          if test -f data/model/evaluation.json; then git add data/model/evaluation.json; fi
          if test -f data/model/games_history.json; then git add data/model/games_history.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update NBA standings, rosters and player stats'
            git push
          fi
