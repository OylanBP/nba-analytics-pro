name: Verify NBA v2 model pipeline
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run JavaScript regression tests
        run: node --test tests/*.test.js
      - name: Run model unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build historical pregame features
        run: python scripts/build_model_history.py
      - name: Train candidate and evaluate
        run: python scripts/model_lifecycle.py --mode train
      - name: Verify expanding-window model calibration
        run: python scripts/rolling_backtest.py
      - name: Install NBA PDF parser
        run: sudo apt-get install -y poppler-utils
      - name: Verify live NBA injury report ingestion
        run: python scripts/fetch_official_injuries.py
      - name: Build enhanced pregame Elo and recent form
        run: python scripts/enhanced_features.py
      - name: Evaluate enhanced challenger
        run: python scripts/enhanced_model.py
      - name: Test guarded Elo promotion
        run: python scripts/promote_enhanced.py
      - name: Audit real historical injury labels
        run: python scripts/audit_injury_training.py
      - name: Reproduce player-role selection on chronological games
        run: |
          python scripts/availability.py
          python - <<'CHECK'
          import json
          from pathlib import Path
          model=json.loads(Path('data/model/availability.json').read_text())
          role=model['player_role']
          assert model['train']+model['test']==model['paired']
          assert role['covered_test_games']>=40
          assert len(role['weights'])==12
          expected=all(role['metrics'][k]<min(model['baseline'][k],model['adjusted'][k]) for k in ('brier','log_loss'))
          assert role['approved']==expected
          CHECK
      - name: Generate model probabilities
        run: python scripts/predict_games.py
      - name: Verify output consistency
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('data/model')
          history=json.loads((root/'games_history.json').read_text())
          champion=json.loads((root/'champion.json').read_text())
          report=json.loads((root/'evaluation.json').read_text())
          prediction=json.loads((root/'predictions.json').read_text())
          assert len(history)>=200
          assert len(champion['weights'])==5
          assert report['holdout_games']>=40
          for g in prediction['predictions']:
              assert abs(g['home_win_probability']+g['away_win_probability']-1)<0.0002
          print('Verified history:',len(history),'future predictions:',len(prediction['predictions']))
          PY
