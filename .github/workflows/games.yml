name: NBA 比賽資料與模型驗證
on:
  workflow_dispatch:
  push:
    branches: [development/v2-analytics]
    paths: ['scripts/update_games.py', '.github/workflows/games.yml', 'analytics*.js', 'tests/**', 'index.html']
permissions:
  contents: write
concurrency:
  group: nba-games-${{ github.ref }}
  cancel-in-progress: false
jobs:
  games:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 驗證分析邏輯
        run: node --test tests/*.test.js
      - name: 更新 ESPN 例行賽賽程
        run: python scripts/update_games.py
      - name: 驗證桌機與手機操作
        run: |
          npm install --prefix "$RUNNER_TEMP/nba-browser" playwright@1.55.0
          python -m http.server 8172 --bind 127.0.0.1 >/tmp/nba-server.log 2>&1 &
          NODE_PATH="$RUNNER_TEMP/nba-browser/node_modules" node tests/browser.cjs
      - name: 儲存已驗證資料
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/games.json
          if ! git diff --cached --quiet; then
            git commit -m '更新 NBA 例行賽歷史與賽程'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
