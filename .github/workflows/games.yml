name: NBA 比賽資料與模型驗證
on:
  workflow_dispatch:
  push:
    branches: [development/v2-analytics]
    paths: ['scripts/update_games.py', '.github/workflows/games.yml', 'analytics*.js', 'tests/**', 'index.html']
  schedule:
    - cron: '0 7 * * *'
permissions:
  contents: write
concurrency:
  group: nba-games-${{ github.ref }}
  cancel-in-progress: false
jobs:
  games:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 驗證分析邏輯
        run: node --test tests/*.test.js
      - name: 更新 ESPN 例行賽賽程
        run: python scripts/update_games.py
      - name: 儲存已驗證資料
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/games.json
          if ! git diff --cached --quiet; then
            git commit -m '更新 NBA 例行賽歷史與賽程'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
