name: Backfill official historical NBA injuries
on:
  workflow_dispatch:
  schedule:
    - cron: '15 4 * * 2'
permissions:
  contents: write
concurrency:
  group: nba-injury-ingestion
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF parser
        run: sudo apt-get install -y poppler-utils
      - name: Backfill official historical reports
        run: |
          python scripts/collect_availability.py
          python scripts/availability.py
          python scripts/predict_games.py
      - name: Audit availability of historical training labels
        run: python scripts/audit_injury_training.py
      - name: Commit sourced archives
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/injuries/labeled_games.json data/model/availability.json data/model/predictions.json data/model/injury_readiness.json
          if ! git diff --cached --quiet; then
            git commit -m "Backfill official historical NBA injury snapshots"
            git push
          fi
