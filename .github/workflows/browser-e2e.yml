name: Browser and mobile end-to-end verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 8 * * *'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve site
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/nba-http.log 2>&1 &
          echo $! > /tmp/nba-http.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/ > /dev/null && exit 0; sleep 1; done
          exit 1
      - name: Test desktop, iPhone and small screens
        run: npx playwright test tests/browser.spec.cjs --reporter=line
      - name: Upload screenshots and test traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-browser-e2e-results
          path: |
            test-results/
            playwright-report/
          retention-days: 14
