name: Archive official NBA injury reports
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/archive-injuries.yml'
  schedule:
    - cron: '2-59/5 * * * *'
permissions:
  contents: write
concurrency:
  group: nba-injury-ingestion
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official PDF parser
        run: sudo apt-get install -y poppler-utils
      - name: Fetch and validate NBA official pregame reports
        run: python scripts/fetch_official_injuries.py
      - name: Audit historical injury-training readiness
        run: python scripts/audit_injury_training.py
      - name: Refresh matchup-scoped predictions
        run: python scripts/predict_games.py
      - name: Save sourced snapshots and prediction metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/injuries/snapshots.json data/model/predictions.json data/model/injury_readiness.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive timestamped official NBA injury reports"
            git push
          fi
