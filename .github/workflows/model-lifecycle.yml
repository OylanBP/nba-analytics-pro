name: NBA model lifecycle (guarded)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/model_lifecycle.py'
      - 'scripts/build_model_history.py'
      - 'scripts/predict_games.py'
      - '.github/workflows/model-lifecycle.yml'
  schedule:
    - cron: '20 7 * * 1'
permissions:
  contents: write
concurrency:
  group: nba-model-lifecycle
  cancel-in-progress: false
jobs:
  evaluate-and-train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build real pregame training history
        run: python scripts/build_model_history.py
      - name: Evaluate challenger against champion
        run: python scripts/model_lifecycle.py --mode evaluate
      - name: Retrain on first Monday of month
        shell: bash
        run: |
          if ! test -f data/model/champion.json || test "$(date -u +%d)" -le 7; then
            python scripts/model_lifecycle.py --mode train
          fi
      - name: Run rolling out-of-sample backtest and calibration
        run: python scripts/rolling_backtest.py
      - name: Export approved predictions
        run: python scripts/predict_games.py
      - name: Commit model artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/model/games_history.json data/model/evaluation.json data/model/rolling_backtest.json
          if test -f data/model/champion.json; then git add data/model/champion.json; fi
          if test -f data/model/predictions.json; then git add data/model/predictions.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Update verified NBA model history and evaluation"
            git push
          fi
